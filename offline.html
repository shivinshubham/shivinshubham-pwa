<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - ShivinShubham</title>
    <style>
        /* Modern, minimal layout styling aligned with your digital hub brand */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0267b8;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 400px;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #888888;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }
        p {
            font-size: 15px;
            color: #666666;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .btn-retry {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-decoration: none;
        }
        .btn-retry:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Visual network drop connection icon anchor -->
        <div class="icon">📡</div>
        <h1>You are offline</h1>
        <p>Please check your internet connection. ShivinShubham apps and solutions require an active connection to sync data.</p>
        <!-- Refreshes the application shell to attempt recovery -->
        <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
