<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShivinShubham</title>
    
    <!-- Link to the Web App Manifest defining PWA desktop configurations -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* Minimal loading fallback layout while redirect processes */
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #0267b8; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .loader {
            font-size: 16px;
            color: #666666;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="loader">Loading ShivinShubham</div>

    <script>
        /**
         * PWA Deep-Link Shortcut & Domain Redirector
         * Bypasses Google Sites iframe blocks by safely jumping the user 
         * directly onto your core domain target natively.
         */
        const urlParams = new URLSearchParams(window.location.search);
        const pageTarget = urlParams.get('page');
        let destination = "https://www.shivinshubham.com";

        if (pageTarget) {
            if (pageTarget === 'blogs') {
                destination = 'https://blogs.shivinshubham.com';
            } else {
                destination = `https://www.shivinshubham.com/${pageTarget}`;
            }
        }

        // Execute immediate standalone top-level window location relocation
        window.location.replace(destination);

        /**
         * Service Worker Registration Block
         * Maintained securely to pass PWABuilder store evaluation scoring.
         */
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("PWA Service Worker Operational"))
            .catch((err) => console.error("Service Worker Error:", err));
        }
    </script>
</body>
</html>
